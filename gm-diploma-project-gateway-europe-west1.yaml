apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gm-diplma-project-gateway
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/finalizer
spec:
  project: default
  source:
    repoURL: https://github.com/MartinovG/DiplomaProject-ArgoCD.git
    targetRevision: gcp
    path: europe-west1/gateway-infra
  destination:
    server: https://kubernetes.default.svc
    namespace: gateway-infra
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true