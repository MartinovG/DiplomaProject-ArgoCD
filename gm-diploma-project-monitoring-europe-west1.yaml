apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gm-diploma-project-monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/finalizer
spec:
  project: default
  source:
    repoURL: https://github.com/MartinovG/DiplomaProject-ArgoCD.git
    targetRevision: gcp
    path: europe-west1/prod/monitoring
    directory:
      recurse: true
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argocd
  syncPolicy:
    syncOptions:
    automated:
      prune: true
      selfHeal: true