app:
  postgres:
    enabled: true
    secretManagerKey: "gm-preview-db-password"

  global:
    name: gm-diploma-project
    namespace: default
    serviceAccountName: gm-diploma-project-sa

    ingress:
      enabled: false
      
    gateway:
      enabled: true
      hostnameSuffix: "136-68-21-205.sslip.io"
      hostPrefix: "preview"

  apps:
    backend:
      livenessProbePath: "/api/health"
      readinessProbePath: "/api/health"
      replicaCount: 1 
      containerPort: 4000
      image:
        repository: europe-west1-docker.pkg.dev/playground-s-11-7655b4b5/gm-diploma-project/backend
        tag: latest 
        pullPolicy: Always
      service:
        port: 4000
      ingressPath: /api
      autoscaling:
        enabled: true
        minReplicas: 1
        maxReplicas: 2
        targetCPUUtilizationPercentage: 50 
      resources: 
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          cpu: "500m"
          memory: "512Mi"
      env:
        - name: DB_HOST
          value: "postgres"
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: "gmdiplomaprojectdb"
        - name: DB_USER
          value: "postgres"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
        - name: DATABASE_URL
          value: "postgresql://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)"

    frontend:
      livenessProbePath: "/api/health"
      readinessProbePath: "/api/health"
      replicaCount: 1
      containerPort: 3000
      image:
        repository: europe-west1-docker.pkg.dev/playground-s-11-7655b4b5/gm-diploma-project/frontend
        tag: latest 
        pullPolicy: Always
      service:
        port: 80
      ingressPath: /
      autoscaling:
        enabled: true 
        minReplicas: 2
        maxReplicas: 5
        targetCPUUtilizationPercentage: 80
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
      env:
        - name: NEXT_PUBLIC_API_URL
          value: "/api"